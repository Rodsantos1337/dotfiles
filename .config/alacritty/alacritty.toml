[env]
TERM = "xterm-256color"

[window]
opacity = 1.0
dynamic_title = true
padding = { x = 4, y = 4 }

[font]
size = 12.0

[font.normal]
family = "GeistMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "GeistMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "GeistMono Nerd Font Mono"
style = "Italic"

[font.offset]
x = 0
y = 1

[font.glyph_offset]
x = 0
y = 1

[colors.primary]
background = "#1e2326"
foreground = "#d3c6aa"

[colors.cursor]
text = "#1e2326"
cursor = "#d3c6aa"

[colors.normal]
black = "#323c41"
red = "#e67e80"
green = "#a7c080"
yellow = "#dbbc7f"
blue = "#7fbbb3"
magenta = "#d699b6"
cyan = "#83c092"
white = "#d3c6aa"

[colors.bright]
black = "#475258"
red = "#e67e80"
green = "#a7c080"
yellow = "#dbbc7f"
blue = "#7fbbb3"
magenta = "#d699b6"
cyan = "#83c092"
white = "#d3c6aa"

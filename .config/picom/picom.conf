# Picom config for i3 + rotating wallpaper crossfade
backend = "glx";
vsync = true;
use-damage = false;
glx-copy-from-front = false;
xrender-sync-fence = true;

# Window fading (open/close) — supported by picom v13
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.03;
fade-delta = 4;
no-fading-openclose = false;

# Window animations (picom v13 presets: appear/disappear = scale + fade)
animations = ({
    triggers = [ "open", "show" ];
    preset = "appear";
    scale = 0.85;
    duration = 0.2;
}, {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    scale = 0.85;
    duration = 0.2;
});

# Rounded corners (supported by picom v13)
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS",
  "name = 'wallpaper'",
];

# Shadow settings (lighter)
shadow = true;
shadow-radius = 8;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-opacity = 0.2;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS",
  "name = 'wallpaper'"
];

# Performance
use-ewmh-active-win = false;
mark-wmwin-focused = false;
mark-ovredir-focused = false;

# Exclude i3bar / polybar
wintypes:
{
  dock = { shadow = false; };
  desktop = { shadow = false; };
};


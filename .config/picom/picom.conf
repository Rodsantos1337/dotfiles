# picom - Everforest Dim setup, light eye-candy, low RAM
# Unified config: stock picom v13 native animations (no fork needed).
# NVIDIA/GLX tune (vsync + sync-fence); unredir=false on purpose -
# use gaming-toggle ($mod+Shift+g) for CS2 max-FPS instead of auto-unredir.
# Shared on all machines (~/.config/picom symlinked to dotfiles).
# No full-screen blur (that's the RAM/CPU hog). Shadows + fading + rounded
# corners only. inactive-opacity gives depth without compositing cost.

shadow = true;
shadow-radius = 12;
shadow-offset-x = 0;
shadow-offset-y = 4;
shadow-opacity = 0.45;
shadow-color = "#000000";
shadow-exclude = [
  "class_g = 'i3-frame'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "class_g *= 'polybar'",
  "_NET_WM_WINDOW_TYPE@ = '_NET_WM_WINDOW_TYPE_DOCK'",
  "_NET_WM_WINDOW_TYPE@ = '_NET_WM_WINDOW_TYPE_NOTIFICATION'",
  "_GTK_FRAME_EXTENTS@"];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;
no-fading-openclose = false;
fade-exclude = [ ];

# subtle inactive dim (1.0 = off; 0.96 keeps text sharp, cheap)
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
active-opacity-override = false;

# rofi + dunst draw their own rounded borders (see rofi/*.rasi,
# dunstrc corner_radius) - picom re-rounding them double-clips corners.
# Notifications/popups also stay full-opacity: dimming them looks broken.
opacity-rule = [
  "100:class_g = 'Rofi'",
  "100:class_g = 'Dunst'"
];

corner-radius = 8;

# the polybar bar: square corners — it sits flush on the bottom edge,
# rounding looked wrong there (dock type + class name casing safety net)
rounded-corners-exclude = [
  "_NET_WM_WINDOW_TYPE@ = '_NET_WM_WINDOW_TYPE_DOCK'",
  "_NET_WM_WINDOW_TYPE@ = '_NET_WM_WINDOW_TYPE_NOTIFICATION'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "class_g *= 'polybar'",
  "class_g *= 'Polybar'"
];

backend = "glx";
# NVIDIA tune (GLX): sync-fence avoids painting before clients finish
# (intermittent artifacts); vsync=true stabilizes per-frame animation
# interpolation; unredir=false avoids redirect flicker (use
# gaming-toggle/$mod+Shift+g for CS2 max-FPS instead of auto-unredir).
vsync = true;
xrender-sync-fence = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
unredir-if-possible = false;
unredir-if-possible-exclude = [ ];

# animations (stock picom v13 presets, no fork).
# appear/disappear = scale + fade only, NO position movement, so dragging /
# moving tiled windows never distorts. Only open/close/show/hide triggers -
# deliberately no geometry/size/position triggers.
animations = ({
  triggers = ["open", "show"];
  preset = "appear";
  scale = 0.92;
  duration = 0.2;
}, {
  triggers = ["close", "hide"];
  preset = "disappear";
  scale = 0.92;
  duration = 0.2;
});

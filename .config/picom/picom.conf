# picom - Everforest Dim setup, light eye-candy, low RAM
# No full-screen blur (that's the RAM/CPU hog). Shadows + fading + rounded
# corners only. inactive-opacity gives depth without compositing cost.

shadow = true;
shadow-radius = 8;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-opacity = 0.35;
shadow-color = "#000000";
shadow-exclude = [
  "class_g = 'i3-frame'",
  "_GTK_FRAME_EXTENTS@"];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;
no-fading-openclose = false;
fade-exclude = [ ];

# subtle inactive dim (1.0 = off; 0.96 keeps text sharp, cheap)
active-opacity = 1.0;
inactive-opacity = 0.90;
frame-opacity = 1.0;
inactive-opacity-override = false;
active-opacity-override = false;

corner-radius = 8;

# the polybar bar: square corners — it sits flush on the bottom edge,
# rounding looked wrong there (dock type + class name casing safety net)
rounded-corners-exclude = [
  "_NET_WM_WINDOW_TYPE@:a = '_NET_WM_WINDOW_TYPE_DOCK'",
  "class_g *= 'polybar'",
  "class_g *= 'Polybar'"
];

backend = "glx";
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
unredir-if-possible = true;

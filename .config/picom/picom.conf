# Rounded corners + light blur on inactive windows - no shadows, no fading
shadow = false;
fading = false;
frame-opacity = 1.0;

corner-radius = 4;

active-opacity = 1.0;
inactive-opacity = 0.95;

# Light, cheap blur (dual_kawase) only behind inactive windows
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 4;
blur-background-exclude = [  ];

# Smooth 400ms eased transitions for opacity/blur changes (focus in/out)
animations = ({
    triggers = [ "decrease-opacity" ];
    opacity = {
        curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
        duration = 0.2;
        start = "window-raw-opacity-before";
        end = "window-raw-opacity";
    };
    blur-opacity = {
        curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
        duration = 0.2;
        start = "window-blur-opacity-before";
        end = "window-blur-opacity";
    };
}, {
    triggers = [ "increase-opacity" ];
    opacity = {
        curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
        duration = 0.2;
        start = "window-raw-opacity-before";
        end = "window-raw-opacity";
    };
    blur-opacity = {
        curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
        duration = 0.2;
        start = "window-blur-opacity-before";
        end = "window-blur-opacity";
    };
});

backend = "glx";
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
unredir-if-possible = true;

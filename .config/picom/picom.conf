# Rounded corners only - no shadows, no fading, no opacity/blur
shadow = false;
fading = false;
frame-opacity = 1.0;

corner-radius = 4;

backend = "glx";
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
unredir-if-possible = true;

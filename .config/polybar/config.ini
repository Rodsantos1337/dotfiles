; polybar config - Everforest Dim floating rounded (#1e2326 ramp)
; Bottom floating bar, JetBrainsMono Nerd Font Mono 11 (matches i3/rofi/alacritty).
; Internals preferred over fork-per-second scripts (low CPU/RAM).

[colors]
bg = #1e2326
base = #232a2e
hover = #2e383c
border = #3a4141
fg = #ffffff
muted = #7a8478
green = #a7c080
red = #e67e80
yellow = #dbbc7f
blue = #7fbbb3
grey = #475258

[bar/main]
monitor-strict = false
override-redirect = false
bottom = true
width = 100%
offset-y = 0
height = 30
radius = 0
border-top-size = 2
border-top-color = ${colors.border}
padding-left = 0
padding-right = 1
module-margin = 0
fixed-center = true
enable-ipc = true
enable-struts = true

background = ${colors.bg}
foreground = ${colors.fg}

font-0 = Inter:size=12;2
font-1 = GeistMono Nerd Font Mono:size=12;2

modules-left = i3
modules-center = date
modules-right = cpu-temp memory disk volume battery power-profile tray

separator = |
separator-foreground = ${colors.muted}

dim-value = 1.0

cursor-click = pointer
cursor-scroll = ns-resize

[module/i3]
type = internal/i3
pin-workspaces = false
strip-wsnumbers = true
index-sort = true
enable-click = true
label-separator = ""

label-focused = %index%
label-focused-background = ${colors.green}
label-focused-foreground = ${colors.bg}
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-foreground = ${colors.fg}
label-unfocused-padding = 1

label-visible = %index%
label-visible-underline = ${colors.muted}
label-visible-padding = 1

label-urgent = %index%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 1

label-occupied = %index%
label-occupied-foreground = ${colors.fg}
label-occupied-padding = 1

[module/cpu-temp]
type = internal/temperature
thermal-zone = 5
warn-temperature = 80
interval = 5
units = true
format = <label>
format-padding = 1
format-prefix = " "
format-prefix-foreground = ${colors.fg}
label = %temperature-c%
label-foreground = ${colors.fg}
format-warn = <label-warn>
label-warn = %temperature-c%
label-warn-foreground = ${colors.red}

[module/memory]
type = internal/memory
interval = 5
format = <label>
format-padding = 1
format-prefix = " "
format-prefix-foreground = ${colors.fg}
label = %used%
label-foreground = ${colors.fg}

[module/disk]
type = internal/fs
mount-0 = /
interval = 60
fixed-values = true
format-mounted = <label-mounted>
format-mounted-padding = 1
format-mounted-prefix = " "
format-mounted-prefix-foreground = ${colors.fg}
label-mounted = %free%
label-mounted-foreground = ${colors.fg}

[module/volume]
type = internal/pulseaudio
interval = 2
format-volume = <label-volume>
format-volume-padding = 1
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.fg}
label-volume = %percentage%%
label-volume-foreground = ${colors.fg}
format-muted = <label-muted>
format-muted-padding = 1
format-muted-prefix = " "
format-muted-prefix-foreground = ${colors.red}
label-muted = muted
label-muted-foreground = ${colors.red}
click-right = pavucontrol &

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 30
full-at = 99
format-charging = <animation-charging> <label-charging>
format-charging-padding = 1
format-discharging = <ramp-capacity> <label-discharging>
format-discharging-padding = 1
format-full = <ramp-capacity> <label-full>
format-full-padding = 1
label-charging = %percentage%%
label-charging-foreground = ${colors.green}
label-discharging = %percentage%%
label-discharging-foreground = ${colors.fg}
label-full = %percentage%%
label-full-foreground = ${colors.fg}
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.fg}
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${colors.green}
animation-charging-framerate = 750

[module/power-profile]
type = custom/script
exec = ~/.config/i3/scripts/pp-indicator
interval = 10
format = <label>
format-padding = 1
format-prefix = " "
format-prefix-foreground = ${colors.green}
label-foreground = ${colors.green}
click-left = ~/.config/i3/scripts/power-profiles &

[module/date]
type = internal/date
interval = 20
date = %a %d %b %H:%M
format = <label>
format-padding = 1
label = %date%
label-foreground = ${colors.fg}

[module/tray]
type = internal/tray
tray-size = 16
tray-spacing = 6
tray-padding = 4
background = ${colors.bg}

[settings]
screenchange-reload = true
pseudo-transparency = false
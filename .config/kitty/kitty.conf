# Window
background_opacity 1.0
window_padding_width 4

# Font
font_family GeistMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 10.0

# Font offsets (alacritty uses offset + glyph_offset)
adjust_line_height 1
adjust_column_width 0

# Colors (Salvia Dim)
background #0f1010
foreground #e4e2d8
selection_background #e4e2d8
selection_foreground #0f1010

# Cursor
cursor_text_color #0f1010
cursor #e4e2d8

# NOTE (ttt nav fix): the four send_text rewrites below used to turn
# Ctrl/Alt+Left/Right into readline bytes (ESC b/f, 0x01/0x05) for the shell.
# They applied to EVERY program in kitty, so fullscreen apps like ttt never
# saw the real arrow keys (Ctrl+Left arrived as Ctrl+A = select-all, etc.).
# Disabled so apps receive standard modified-arrow sequences; the same shell
# behavior now lives in ~/.inputrc. Revert: uncomment the four map lines.
# map alt+left send_text all \x1bb
# map alt+right send_text all \x1bf
# map ctrl+left send_text all \x01
# map ctrl+right send_text all \x05

# Normal colors (black, red, green, yellow, blue, magenta, cyan, white)
color0 #1d1f1e
color1 #cf6f63
color2 #9fb892
color3 #d6a33a
color4 #7a9fc0
color5 #b09ac4
color6 #7fb5ab
color7 #c4c6bd

# Bright colors
color8 #6c6f6a
color9 #e08a7e
color10 #b4cba6
color11 #e8bd5e
color12 #9bbbd6
color13 #c8b3d9
color14 #9ccbc1
color15 #eceae0

# Disable close confirmation
confirm_os_window_close 0

# Tab bar styling
tab_bar_style separator
tab_separator "   │  "

# Font for tabs (different from main terminal font)
tab_font_family GeistMono Nerd Font Mono
tab_font_size 10.0

# Active/inactive tab styling
active_tab_font_style bold
inactive_tab_font_style normal
active_tab_foreground #0f1010
active_tab_background #a8bf9c
inactive_tab_foreground #e4e2d8
inactive_tab_background #0f1010
tab_bar_background #0f1010

# Terminal-style tab shortcuts
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9

# Window/split navigation with arrow keys (ctrl+alt+arrows, so they don't
# clash with ctrl+shift+arrows which switch tabs)
map ctrl+alt+left focus_window left
map ctrl+alt+right focus_window right
map ctrl+alt+up focus_window up
map ctrl+alt+down focus_window down

# Split panes: 'vertical' splits by a vertical line (panes side by side),
# 'horizontal' splits by a horizontal line (panes stacked)
map ctrl+alt+enter split horizontal
map ctrl+alt+\\ split vertical

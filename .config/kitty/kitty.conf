# Window
background_opacity 1.0
window_padding_width 4

# Font
font_family GeistMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 10.0

# Font offsets (alacritty uses offset + glyph_offset)
adjust_line_height 1
adjust_column_width 0

# Colors
background #1e2326
foreground #ffffff
selection_background #ffffff
selection_foreground #1e2326

# Cursor
cursor_text_color #1e2326
cursor #ffffff

# Normal colors (black, red, green, yellow, blue, magenta, cyan, white)
color0 #323c41
color1 #e67e80
color2 #a7c080
color3 #dbbc7f
color4 #7fbbb3
color5 #d699b6
color6 #83c092
color7 #ffffff

# Bright colors
color8 #475258
color9 #e67e80
color10 #a7c080
color11 #dbbc7f
color12 #7fbbb3
color13 #d699b6
color14 #83c092
color15 #ffffff

# Disable close confirmation
confirm_os_window_close 0

# Terminal-style tab shortcuts
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9
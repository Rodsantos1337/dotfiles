<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- System UI font: JetBrainsMono Nerd Font Mono everywhere. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>JetBrainsMono Nerd Font Mono</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>JetBrainsMono Nerd Font Mono</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font Mono</family></prefer>
  </alias>
  <!-- Anything that asks for plain "JetBrains Mono" gets the Nerd variant
       (icons/glyphs included). -->
  <alias>
    <family>JetBrains Mono</family>
    <prefer><family>JetBrainsMono Nerd Font Mono</family></prefer>
  </alias>
  <!-- Sharper rendering on downscaled 1080p->768p TV: keep your font choice,
       just force best-practice smoothing. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>

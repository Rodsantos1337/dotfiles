<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- System UI font: JetBrainsMono Nerd Font Mono everywhere (replaces Inter). -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>JetBrainsMono Nerd Font Mono</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>JetBrainsMono Nerd Font Mono</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font Mono</family></prefer>
  </alias>
  <!-- Anything that asks for "JetBrains Mono" by name (old configs, apps)
       still gets the nerd version instead of the vanilla package. -->
  <alias>
    <family>JetBrains Mono</family>
    <prefer><family>JetBrainsMono Nerd Font Mono</family></prefer>
  </alias>
</fontconfig>

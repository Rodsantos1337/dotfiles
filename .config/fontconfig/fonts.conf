<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- System UI font: GeistMono Nerd Font Mono everywhere (replaces Inter). -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>GeistMono Nerd Font Mono</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>GeistMono Nerd Font Mono</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>GeistMono Nerd Font Mono</family></prefer>
  </alias>
  <!-- Anything that asks for "JetBrains Mono" by name (old configs, apps)
       gets GeistMono instead (JetBrains is no longer installed). -->
  <alias>
    <family>JetBrains Mono</family>
    <prefer><family>GeistMono Nerd Font Mono</family></prefer>
  </alias>
</fontconfig>

# i3blocks config - EndeavourOS Everforest (accent #829181)
# Icons are Font Awesome 4.7 glyphs, rendered by the Nerd Font bar font.
# Data blocks use self-contained commands (no external EndeavourOS scripts).

separator=false
markup=pango

# Disk usage (free space on /)
[disk]
label= 
color=#ffffff
instance=/
command=df -h / | awk 'NR==2 {print $4}'
interval=30

# Memory usage (used / total)
[memory]
label= 
color=#ffffff
command=free -h | awk '/^Mem/ {print $3 "/" $2}'
interval=2

# CPU temperature (package)
[CPU-temperature]
label= 
color=#ffffff
command=sensors 2>/dev/null | awk '/^Package id 0/ {for(i=1;i<=NF;i++) if($i~/°C$/){gsub(/[^0-9.]/,"",$i); print $i "°C"; exit}}'
interval=30

# Volume (pactl) - left-click: mute | scroll: +-5% | right-click: pavucontrol
# Refreshed on volume key presses via $refresh_i3blocks (signal=1)
[volume]
color=#ffffff
command=~/.config/i3/scripts/volume
interval=2
signal=1

# Battery (auto-hidden when no battery present)
[battery]
color=#ffffff
command=~/.config/i3/scripts/battery
interval=30

# day and time
[time]
color=#ffffff
command=date '+%a %d %b %H:%M'
interval=1

# right margin after the clock (bump min_width for more space)
[padding-right]
full_text=
separator=false
min_width=10
